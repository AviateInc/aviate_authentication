apiVerion: apps/v1
kind: Deployment
metadata:
  name: backend
spec: 
  replicas: 2 
  selector: 
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: aviate-backend:latest
        imagePullPolicy: ifNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: JWT_SECRET
          valueFrom: 
            secretKeyRef: 
              name: aviate-secrets
              key: JWT_SECRET
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: 
              name: aviate-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: 
              name: aviate-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: aviate-secrets
              key: POSTGRES_DB
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
          livenessProbe: 
            httpGet:
              path: /health
              port: 5000
              initialDelaySeconds: 30
              periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec: 
  selector:
    app: backend
  ports: 
  - port: 5000
    targetPort: 5000
  type: Loadbalancer
